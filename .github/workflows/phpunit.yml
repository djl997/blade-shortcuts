# PHPUnit tests

name: PHPUnit tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: 10, testbench: 8, php: '8.1' }
          - { laravel: 10, testbench: 8, php: '8.3' }
          - { laravel: 11, testbench: 9, php: '8.2' }
          - { laravel: 11, testbench: 9, php: '8.4' }
          - { laravel: 12, testbench: 10, php: '8.2' }
          - { laravel: 12, testbench: 10, php: '8.4' }
          - { laravel: 13, testbench: 11, php: '8.3' }
          - { laravel: 13, testbench: 11, php: '8.4' }

    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:^${{ matrix.laravel }}.0" --no-update --no-interaction
          composer require --dev "orchestra/testbench:^${{ matrix.testbench }}.0" --no-update --no-interaction
          # EOL Laravel 10/11 have open advisories; Composer blocks them by default
          composer update --prefer-dist --no-progress --no-interaction --no-security-blocking

      - name: Run tests
        run: vendor/bin/phpunit
